[package]
name = "oris-mania-utils"
version = "1.0.0"
description = "ori's mania utils - skill ratings and overlays for osu!mania"
authors = ["Oriana"]
license = "MIT"
repository = "https://github.com/orianawooo/oris-mania-utils"
edition = "2021"

[lib]
name = "oris_mania_utils_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
rfd = "0.15"
minacalc-rs = "515.1.1"
tokio-tungstenite = "0.21"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
rdev = "0.5.3"
lazy_static = "1.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["shape"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
epaint_default_fonts = "0.29"

[[bin]]
name = "oris-mania-utils"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.minacalc-sys]
opt-level = 1
