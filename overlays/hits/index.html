<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hit counter - ori's mania utils</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="hit-counter" class="hit-counter" data-style="radar-twin">
        <div id="tosu-offline-badge" class="tosu-offline-badge"><span class="tosu-dot"></span>tosu! offline</div>
        <div id="hit-ratio-row" class="hit-ratio-row">
            <span class="j-label ratio-label">ratio</span>
            <span id="val-ratio" class="j-val ratio-val">0.00</span>
        </div>
        <div id="hit-items" class="hit-items">
            <div class="judgment-item" data-hit-index="0">
                <span class="j-label" data-hit-part="label">max</span>
                <span id="val-max" class="j-val" data-hit-part="value">0</span>
            </div>
            <div class="judgment-item" data-hit-index="1">
                <span class="j-label" data-hit-part="label">300</span>
                <span id="val-perf" class="j-val" data-hit-part="value">0</span>
            </div>
            <div class="judgment-item" data-hit-index="2">
                <span class="j-label" data-hit-part="label">200</span>
                <span id="val-great" class="j-val" data-hit-part="value">0</span>
            </div>
            <div class="judgment-item" data-hit-index="3">
                <span class="j-label" data-hit-part="label">100</span>
                <span id="val-good" class="j-val" data-hit-part="value">0</span>
            </div>
            <div class="judgment-item" data-hit-index="4">
                <span class="j-label" data-hit-part="label">50</span>
                <span id="val-bad" class="j-val" data-hit-part="value">0</span>
            </div>
            <div class="judgment-item" data-hit-index="5">
                <span class="j-label" data-hit-part="label">miss</span>
                <span id="val-miss" class="j-val" data-hit-part="value">0</span>
            </div>
            <div id="hit-ratio-cell" class="judgment-item ratio-cell hidden">
                <span class="j-label">ratio</span>
                <span id="val-ratio-cell" class="j-val ratio-val">0.00</span>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
